<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文案工坊 · 管理后台</title>
<link rel="icon" type="image/svg+xml" href="/mark.svg" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- 登录 / 首次设置 -->
<div id="gate" class="auth-screen hidden">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>管理后台</span></div>
    <p class="auth-sub" id="gateSub">这是独立于业务账号的管理入口。</p>

    <form id="gateForm" autocomplete="off">
      <label>管理员用户名<input name="username" required maxlength="24" autocomplete="username" /></label>
      <label>密码<input name="password" type="password" required autocomplete="current-password" /></label>
      <p class="form-error" id="gateError"></p>
      <button class="btn primary block" type="submit" id="gateSubmit">登录</button>
    </form>
    <p class="auth-tip"><a href="/">← 回到文案工坊</a></p>
  </div>
</div>

<!-- 后台主体 -->
<div id="panel" class="app hidden">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>管理后台</span></div>
    <div class="topbar-right">
      <span class="chip" id="llmChip">…</span>
      <span class="user-name" id="adminName"></span>
      <a class="btn ghost small" href="/">前台</a>
      <button class="btn ghost small" id="logoutBtn">退出</button>
    </div>
  </header>

  <div class="admin-layout">
    <nav class="admin-nav" id="adminNav"></nav>
    <main class="main admin-main">
    <section class="card" data-sec="overview">
      <div class="card-head">
        <h2>使用概览</h2>
        <div class="card-actions">
          <select id="days">
            <option value="1">近 1 天</option>
            <option value="7" selected>近 7 天</option>
            <option value="30">近 30 天</option>
            <option value="90">近 90 天</option>
          </select>
          <button class="btn ghost small" id="refreshBtn">刷新</button>
        </div>
      </div>
      <div class="stat-row" id="stats"></div>
      <div class="spark" id="spark"></div>
    </section>

    <section class="card" data-sec="ab">
      <h2>提示词 A/B<span class="sub">同一个功能挂多份 system，按权重分流；每次调用都记下用的哪一份</span></h2>
      <div class="ab-bar">
        <select id="abFeature"></select>
        <button class="btn ghost small" id="abNewBtn">＋ 新变体</button>
        <span class="grow"></span>
        <span class="hint" id="abHint"></span>
      </div>
      <div id="abList"></div>

      <div class="ab-edit hidden" id="abEdit">
        <div class="grid">
          <label>变体名<input id="abName" maxlength="40" placeholder="例：更狠的差异要求"></label>
          <label>权重<input id="abWeight" type="number" min="0" max="20" value="1"></label>
          <label class="chk"><input type="checkbox" id="abActive"> 生效（参与线上分流）</label>
        </div>
        <label class="full">备注<input id="abNote" maxlength="300" placeholder="改了什么、想验证什么"></label>
        <label class="full">system 提示词<textarea id="abSystem" rows="12" spellcheck="false"></textarea></label>
        <div class="ab-edit-foot">
          <button class="btn ghost small" id="abFromBuiltin">从内置那份复制</button>
          <span class="grow"></span>
          <button class="btn ghost small" id="abCancel">取消</button>
          <button class="btn primary small" id="abSave">保存</button>
        </div>
        <p class="form-error" id="abError"></p>
      </div>
    </section>

    <section class="card" data-sec="eval">
      <h2>Eval<span class="sub">固定用例 × 各个变体跑一遍，比确定性指标，再盲测挑一个</span></h2>
      <div class="ab-bar">
        <select id="evFeature"></select>
        <button class="btn ghost small" id="evCaseAdd">＋ 用例</button>
        <button class="btn primary small" id="evRun">跑一批</button>
        <span class="grow"></span>
        <select id="evBatch"></select>
      </div>
      <div id="evCases"></div>
      <div id="evResult"></div>
    </section>

    <section class="card" data-sec="cost">
      <h2>成本估算<span class="sub" id="costNote"></span></h2>
      <div class="table-wrap"><table class="admin-table" id="costTable"></table></div>
    </section>

    <section class="card" data-sec="pay">
      <h2>支付接入<span class="sub">商户私钥能以你的名义收款，所以这里加密存、只写不读</span></h2>
      <p class="hint" id="setWarn"></p>
      <div class="ab-bar">
        <button class="btn ghost small" id="setCheck">连通性自检</button>
        <span class="grow"></span>
        <span class="hint" id="setChecked"></span>
      </div>
      <div id="setChecks"></div>
      <div id="setFields"></div>
    </section>

    <section class="card" data-sec="users">
      <h2>用户</h2>
      <div class="table-wrap"><table class="admin-table" id="usersTable"></table></div>
    </section>

    <section class="card" data-sec="usage">
      <h2>各功能用量</h2>
      <div class="table-wrap"><table class="admin-table" id="featuresTable"></table></div>
      <div class="admin-errors" id="errors"></div>
    </section>

    <section class="card" data-sec="prompts">
      <div class="card-head">
        <h2>各功能的提示词</h2>
        <span class="counter" id="promptNote"></span>
      </div>
      <div class="prompts" id="prompts"></div>
    </section>

    <section class="card" data-sec="admins">
      <h2>管理员账号</h2>
      <div class="table-wrap"><table class="admin-table" id="adminsTable"></table></div>
    </section>
    </main>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<script src="/dialog.js"></script>
<script src="/admin.js" type="module"></script>
</body>
</html>
